name: CourseOS Continuous Integration Pipeline

on:
  push:
    branches:
      - main  # Triggers the pipeline automatically when code hits the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx Tooling
      uses: docker/setup-buildx-action@v3

    - name: Authenticate Container Registry (Docker Hub)
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract Short Git Commit SHA Code
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Compile and Push Container Optimized Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/courseos:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/courseos:${{ steps.vars.outputs.sha_short }}
