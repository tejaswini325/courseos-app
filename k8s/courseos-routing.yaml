apiVersion: v1
kind: Service
metadata:
  name: courseos-active-svc
  namespace: production
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: courseos-engine # Bound dynamically to Active Production release nodes
---
apiVersion: v1
kind: Service
metadata:
  name: courseos-preview-svc
  namespace: production
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: courseos-engine # Bound dynamically to Preview/Staging release nodes
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: courseos-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: courseos-active-svc
            port:
              number: 80